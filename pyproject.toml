[project]
name = "favorite-places-pipeline"
version = "0.1.0"
description = "Data pipeline for favorite-places."
license = { file = "LICENSE" }
requires-python = ">=3.14,<3.15"
dependencies = [
  "gmaps-scraper",
  "langfuse==4.6.1",
  "pillow>=12.2.0,<13.0.0",
  "pycountry>=24.6.1,<25.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",
  "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "pyrefly>=1.0.0,<2.0.0",
  "ruff>=0.14.1,<0.15.0",
]

[tool.uv]
exclude-newer = "P7D"

[tool.uv.sources]
gmaps-scraper = { path = "vendor/gmaps-scraper" }

[tool.ruff]
target-version = "py314"
extend-exclude = ["vendor"]

[tool.pyrefly]
project-includes = [
  "scripts/pipeline_models.py",
  "scripts/refresh_profiles.py",
  "scripts/refresh_summary.py",
]
project-excludes = ["**/vendor/"]
python-version = "3.14.0"
preset = "legacy"
ignore-missing-imports = ["*"]

[tool.pyrefly.errors]
redundant-cast = "warn"
