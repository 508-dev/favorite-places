[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmaps-scraper"
version = "0.1.0"
description = "Extract data from Google Maps saved lists and place pages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cloakbrowser==0.4.3",
  "curl-cffi==0.15.1b2",
]

[project.scripts]
gmaps-scraper = "gmaps_scraper.cli:main"

[dependency-groups]
dev = [
  "prek",
  "pyrefly>=1.1.1",
  "ruff",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.pip]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/gmaps_scraper"]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.14"
preset = "strict"
check-unannotated-defs = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gmaps_scraper"]
